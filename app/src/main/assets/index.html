<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laravel Chat</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1a1c20;--muted:#6b7280;--me:#2f6feb;--them:#e8eaee;--line:#e3e5e9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--text:#eceef2;--muted:#9aa1ad;--them:#262a33;--line:#2a2e37;color-scheme:dark}}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;height:100%;max-width:980px;margin:0 auto;background:var(--panel);border-inline:1px solid var(--line)}
.side{width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.side h1{font-size:18px;margin:0;padding:16px}
.room{display:flex;gap:12px;padding:12px 16px;cursor:pointer;border:0;background:none;color:inherit;text-align:left;width:100%}
.room:hover,.room.on{background:var(--bg)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.room small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.head input{margin-left:auto;width:140px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:inherit}
.back{display:none;background:none;border:0;color:var(--me);font-size:20px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--them);word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--me);color:#fff}
.b span{display:block;font-size:11px;opacity:.7;margin-top:2px}
.form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.form input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:inherit;font-size:15px}
.form button{border:0;border-radius:999px;padding:0 18px;background:var(--me);color:#fff;font-weight:600}
.side h1{display:flex;align-items:center;justify-content:space-between}
.gear{background:none;border:0;color:var(--muted);font-size:20px}
.cfg{display:flex;gap:6px;padding:0 16px 8px}.cfg input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:inherit}.cfg button{border:0;border-radius:8px;background:var(--me);color:#fff;padding:0 12px}
.err{margin:0 16px 8px;padding:8px 10px;border-radius:8px;background:#e0603a22;color:#e0603a;font-size:13px}
.empty{margin:auto;color:var(--muted)}
@media (max-width:700px){.side{width:100%}.app.chat .side{display:none}.app:not(.chat) .main{display:none}.back{display:block}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo } = React;

/* ===== DSA ===== */
class Queue { constructor(){this.a=[];} enqueue(x){this.a.push(x);} dequeue(){return this.a.shift();} get size(){return this.a.length;} }
class Node { constructor(v){this.v=v;this.next=null;} }
class LinkedList {
  constructor(){this.head=null;this.tail=null;}
  append(v){const n=new Node(v); if(!this.head){this.head=this.tail=n;} else {this.tail.next=n;this.tail=n;}}
  toArray(){const r=[];for(let n=this.head;n;n=n.next)r.push(n.v);return r;}
}
class Trie {
  constructor(){this.root={c:{},ids:new Set()};}
  insert(word,id){let n=this.root;for(const ch of word){n=n.c[ch]||(n.c[ch]={c:{},ids:new Set()});n.ids.add(id);}}
  search(prefix){let n=this.root;for(const ch of prefix){n=n.c[ch];if(!n)return new Set();}return n.ids;}
}

/* ===== API Laravel ===== */
const getBase=()=>{try{return localStorage.getItem("server")||"http://10.0.2.2:8000";}catch(e){return "http://10.0.2.2:8000";}};
const api=(path,opt={})=>fetch(getBase()+"/api"+path,{headers:{"Content-Type":"application/json",Accept:"application/json"},...opt}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
const COLORS=["#2f6feb","#e0603a","#2a9d6f","#8b5cf6"];
const hm=t=>new Date(t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});

function App(){
  const [rooms,setRooms]=useState([]);
  const [active,setActive]=useState(null);
  const [msgs,setMsgs]=useState([]);
  const [pending,setPending]=useState([]);
  const [text,setText]=useState("");
  const [q,setQ]=useState("");
  const [err,setErr]=useState(false);
  const [cfg,setCfg]=useState(false);
  const [url,setUrl]=useState(getBase());
  const saveCfg=e=>{e.preventDefault();try{localStorage.setItem("server",url.trim().replace(/\/+$/,""));}catch(x){}setCfg(false);loadRooms();};
  const queue=useRef(new Queue());
  const busy=useRef(false);
  const end=useRef(null);

  const loadRooms=()=>api("/rooms").then(d=>{setRooms(d);setErr(false);}).catch(()=>setErr(true));
  const loadMsgs=id=>id&&api(`/rooms/${id}/messages`).then(setMsgs).catch(()=>{});

  useEffect(()=>{loadRooms();},[]);
  useEffect(()=>{
    setMsgs([]); loadMsgs(active);
    const t=setInterval(()=>{loadMsgs(active);loadRooms();},3000); // polling
    return ()=>clearInterval(t);
  },[active]);

  const all=useMemo(()=>[...msgs,...pending.filter(p=>p.room===active)],[msgs,pending,active]);
  const trie=useMemo(()=>{
    const t=new Trie();
    all.forEach(m=>m.body.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).forEach(w=>t.insert(w,m.id)));
    return t;
  },[all]);
  const list=useMemo(()=>{
    const ll=new LinkedList(); all.forEach(m=>ll.append(m));
    const arr=ll.toArray(), term=q.trim().toLowerCase();
    if(!term)return arr;
    const ids=trie.search(term); return arr.filter(m=>ids.has(m.id));
  },[all,q,trie]);
  useEffect(()=>{end.current&&end.current.scrollIntoView();},[list.length,active]);

  const drain=async()=>{
    if(busy.current)return; busy.current=true;
    while(queue.current.size){
      const job=queue.current.dequeue();
      try{await api(`/rooms/${job.room}/messages`,{method:"POST",body:JSON.stringify({body:job.body})});}catch(e){}
      setPending(p=>p.filter(x=>x.id!==job.id));
      await loadMsgs(job.room);
    }
    busy.current=false;
  };

  const send=e=>{
    e.preventDefault();
    const body=text.trim(); if(!body||!active)return;
    const id="p"+Date.now();
    setPending(p=>[...p,{id,room:active,sender:"me",body,created_at:new Date().toISOString(),status:"antri"}]);
    queue.current.enqueue({id,room:active,body});
    setText(""); drain();
  };

  const room=rooms.find(r=>r.id===active);
  return (
    <div className={"app"+(active?" chat":"")}>
      <aside className="side">
        <h1>Pesan <button className="gear" onClick={()=>setCfg(!cfg)} aria-label="Server">⚙</button></h1>
        {cfg&&<form className="cfg" onSubmit={saveCfg}><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="http://192.168.1.5:8000"/><button>Simpan</button></form>}
        {err&&<div className="err">Tidak bisa terhubung ke server Laravel. Cek alamat di ⚙.</div>}
        {rooms.map((r,i)=>(
          <button key={r.id} className={"room"+(r.id===active?" on":"")} onClick={()=>{setActive(r.id);setQ("");}}>
            <div className="av" style={{background:COLORS[i%COLORS.length]}}>{r.name[0]}</div>
            <div><b>{r.name}</b><small>{r.last||"Belum ada pesan"}</small></div>
          </button>
        ))}
      </aside>
      <section className="main">
        {room?(<>
          <div className="head">
            <button className="back" onClick={()=>setActive(null)} aria-label="Kembali">‹</button>
            <b>{room.name}</b>
            <input placeholder="Cari kata…" value={q} onChange={e=>setQ(e.target.value)}/>
          </div>
          <div className="msgs">
            {list.length===0&&<div className="empty">Tidak ada pesan</div>}
            {list.map(m=>(
              <div key={m.id} className={"b"+(m.sender==="me"?" me":"")}>
                {m.body}
                <span>{hm(m.created_at)}{m.status?" · "+m.status:""}</span>
              </div>
            ))}
            <div ref={end}/>
          </div>
          <form className="form" onSubmit={send}>
            <input value={text} onChange={e=>setText(e.target.value)} placeholder="Tulis pesan…"/>
            <button type="submit">Kirim</button>
          </form>
        </>):<div className="empty">Pilih percakapan</div>}
      </section>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
